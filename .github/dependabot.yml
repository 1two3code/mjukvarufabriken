# Dependency scanning (M9 security baseline). Weekly, grouped so a wave of transitive bumps is
# one PR per ecosystem/directory instead of thirty. Security advisories still open their own PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    groups:
      workspace-dependencies:
        patterns: ['*']
    ignore:
      # typescript-eslint peers on `typescript <6.1.0`; a major TS bump (e.g. 7.x) breaks `npm ci`
      # with ERESOLVE (seen: PR #11). Hold TS majors until typescript-eslint supports them; minor
      # and patch bumps still flow.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    groups:
      cdk:
        patterns: ['aws-cdk*', 'constructs']
      infra-dependencies:
        patterns: ['*']
        exclude-patterns: ['aws-cdk*', 'constructs']
    open-pull-requests-limit: 3
    labels: [dependencies]

  # The golden template is never edited by hand (CLAUDE.md), but its lockfile still ages —
  # Dependabot bumps are the one sanctioned way its dependencies move.
  - package-ecosystem: npm
    directory: /templates/web
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    groups:
      template-dependencies:
        patterns: ['*']
    ignore:
      # Same TS-major hold as the root workspace (seen: PR #10) — typescript-eslint peers <6.1.0.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 3
    labels: [dependencies, template]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Stockholm
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
