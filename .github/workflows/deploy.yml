name: Deploy

# Deploys on every push to main: dev first, then live (gate live with a required reviewer on the
# `live` GitHub environment). Authenticates to AWS with OIDC — no long-lived keys.
#
# Per environment (Settings → Environments → dev / live) configure:
#   secret  AWS_DEPLOY_ROLE_ARN   IAM role trusted by GitHub's OIDC provider, with CDK deploy rights
#   var     AWS_REGION            e.g. eu-north-1
#   var     AWS_ACCOUNT_ID        the account the environment lives in
#
# One-time: `npx cdk bootstrap aws://<account>/<region>` in each account.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, live]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  dev:
    if: github.event_name == 'push' || inputs.environment == 'dev'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
    secrets: inherit

  live:
    needs: [dev]
    # Runs after dev on push, or alone on a manual live dispatch (dev skipped). A failed dev blocks live.
    if: always() && !failure() && !cancelled() && (github.event_name == 'push' || inputs.environment == 'live')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: live
    secrets: inherit
