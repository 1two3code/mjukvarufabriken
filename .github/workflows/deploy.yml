name: Deploy

# Deploys on every push to main: dev first, then qa, then live (gate live with a required reviewer on
# the `live` GitHub environment). Authenticates to AWS with OIDC — no long-lived keys.
#
# Per environment (Settings → Environments → dev / qa / live) configure:
#   secret  AWS_DEPLOY_ROLE_ARN   IAM role trusted by GitHub's OIDC provider, with CDK deploy rights
#   var     AWS_REGION            e.g. eu-north-1
#   var     AWS_ACCOUNT_ID        the account the environment lives in
#
# Bootstrap (`cdk bootstrap aws://<account>/<region>` and `.../us-east-1` for the budget stack) is
# done by deploy-environment.yml the first time and skipped once the CDKToolkit stack exists.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, qa, live]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  dev:
    if: github.event_name == 'push' || inputs.environment == 'dev'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
    secrets: inherit

  qa:
    needs: [dev]
    # Runs after dev on push, or alone on a manual qa dispatch (dev skipped). A failed dev blocks qa.
    if: always() && !failure() && !cancelled() && (github.event_name == 'push' || inputs.environment == 'qa')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: qa
    secrets: inherit

  live:
    needs: [qa]
    # Runs after qa on push, or alone on a manual live dispatch (dev/qa skipped). A failed qa blocks live.
    if: always() && !failure() && !cancelled() && (github.event_name == 'push' || inputs.environment == 'live')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: live
    secrets: inherit
