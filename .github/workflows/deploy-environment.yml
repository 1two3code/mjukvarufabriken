name: Deploy environment

# Deploys one environment: resources → mf → ops → budget (the same order and stack list as
# infra/scripts/deploy.sh). The budget stack lives in us-east-1 (AWS Budgets is a us-east-1
# service), so the account is bootstrapped there too — a one-time step that is skipped as soon
# as the CDKToolkit stack exists. The deploy role therefore needs the rights `cdk bootstrap`
# uses the first time (CloudFormation + S3 + ECR + IAM for the CDKToolkit stack) in both regions.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix infra

      - name: Build SPAs
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # One-time per account/region. `describe-stacks` on CDKToolkit fails when the region was
      # never bootstrapped; only then is `cdk bootstrap` run.
      - name: CDK bootstrap (if needed)
        working-directory: infra
        run: |
          for region in "$CDK_DEFAULT_REGION" us-east-1; do
            if aws cloudformation describe-stacks --stack-name CDKToolkit --region "$region" >/dev/null 2>&1; then
              echo "aws://$CDK_DEFAULT_ACCOUNT/$region already bootstrapped"
            else
              echo "bootstrapping aws://$CDK_DEFAULT_ACCOUNT/$region"
              npx cdk bootstrap "aws://$CDK_DEFAULT_ACCOUNT/$region"
            fi
          done

      - name: Deploy resources stack
        working-directory: infra
        run: npx cdk deploy resources-${{ inputs.environment }} --require-approval never

      - name: Deploy web stack
        working-directory: infra
        run: npx cdk deploy mf-${{ inputs.environment }} --require-approval never

      - name: Deploy ops stack
        working-directory: infra
        run: npx cdk deploy ops-${{ inputs.environment }} --require-approval never

      - name: Deploy budget stack (us-east-1)
        working-directory: infra
        run: npx cdk deploy budget-${{ inputs.environment }} --require-approval never
