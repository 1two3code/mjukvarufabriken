name: Deploy environment

# Deploys one environment: resources → mf → ops → budget (the same order and stack list as
# infra/scripts/deploy.sh). The budget stack lives in us-east-1 (AWS Budgets is a us-east-1
# service), so the account is bootstrapped there too — a one-time step that is skipped as soon
# as the CDKToolkit stack exists (infra/scripts/ensure-bootstrapped.sh — only "stack does not
# exist" triggers a bootstrap, any other error fails the job). The deploy role therefore needs
# `cloudformation:DescribeStacks` on CDKToolkit in both regions on every run, and the rights
# `cdk bootstrap` uses the first time (CloudFormation + S3 + ECR + IAM for the CDKToolkit stack).
# Each step deploys its stack `--exclusively`: the order below is the dependency order, so no
# stack is deployed twice.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: namespace-profile-mjukvaruhuset
    environment: ${{ inputs.environment }}
    env:
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      # Per-env infra identity written to this GitHub environment by scripts/provision-env (Phoenix,
      # docs/PHOENIX.md). Build only this env; an unset var renders as "" and lib/config.ts falls
      # back to the committed literal, so an env without these set (e.g. dev) is unchanged.
      MF_ENV: ${{ inputs.environment }}
      MF_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      MF_REGION: ${{ vars.AWS_REGION }}
      MF_HOSTED_ZONE_ID: ${{ vars.MF_HOSTED_ZONE_ID }}
      MF_HOSTED_ZONE_NAME: ${{ vars.MF_HOSTED_ZONE_NAME }}
      MF_CLOUDFRONT_CERT_ARN: ${{ vars.MF_CLOUDFRONT_CERT_ARN }}
      MF_API_CERT_ARN: ${{ vars.MF_API_CERT_ARN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix infra

      # Outer layer of the live domain guard (audit 2026-08-31, P0-5). `infra/scripts/deploy.sh`
      # has run this since the 2026-08-30 hardening audit; this workflow — the other path that
      # can deploy live — never did. `bin/app.ts` now also fails closed at synth for whichever env
      # MF_ENV names, so this step is only about failing in seconds instead of after the SPA build.
      - name: Check live domain guard
        if: inputs.environment == 'live'
        working-directory: infra
        run: npx tsx scripts/check-live-domain.ts

      - name: Build SPAs
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # One-time per account/region. Only a missing CDKToolkit stack triggers `cdk bootstrap`;
      # any other describe-stacks error (denied, throttled) fails the job with the CLI's message.
      - name: CDK bootstrap (if needed)
        working-directory: infra
        run: |
          for region in "$CDK_DEFAULT_REGION" us-east-1; do
            scripts/ensure-bootstrapped.sh "$CDK_DEFAULT_ACCOUNT" "$region"
          done

      - name: Deploy resources stack
        working-directory: infra
        run: npx cdk deploy resources-${{ inputs.environment }} --exclusively --require-approval never

      - name: Deploy web stack
        working-directory: infra
        run: npx cdk deploy mf-${{ inputs.environment }} --exclusively --require-approval never

      - name: Deploy ops stack
        working-directory: infra
        run: npx cdk deploy ops-${{ inputs.environment }} --exclusively --require-approval never

      - name: Deploy budget stack (us-east-1)
        working-directory: infra
        run: npx cdk deploy budget-${{ inputs.environment }} --exclusively --require-approval never
