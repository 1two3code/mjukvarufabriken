name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix infra

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run coverage

      - name: Build SPAs
        run: npm run build

      # Renders each built SPA in headless Chrome (preinstalled on ubuntu-latest) and fails if
      # nothing mounts or the console shows an uncaught error — catches bundle-only breakage.
      - name: Smoke-test built SPAs
        run: npm run smoke

      - name: CDK synth
        working-directory: infra
        run: npx cdk synth --quiet

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
