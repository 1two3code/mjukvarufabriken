name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN (audit 2026-08-31, P1-8). This workflow runs on `pull_request`, so it
# checks out PR-head code and then executes it: seven `npm ci` invocations with lifecycle scripts
# enabled, plus `docker build` on two Dockerfiles. Without this block the token falls back to
# whatever the repo/org default scope is — write, for older defaults. Nothing here needs write:
# `actions/upload-artifact` uses the runtime token, not GITHUB_TOKEN. deploy.yml has always declared
# its own permissions; ci.yml — the workflow that actually runs on every PR — did not.
# infra/test/workflows.test.ts pins this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, synth
    runs-on: ubuntu-latest
    # Throwaway Postgres so migrations run against a real server (packages/db migrations.test.ts).
    # Reached at localhost:5432; TEST_DATABASE_URL below opts the migration suite in.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mf
          POSTGRES_PASSWORD: mf
          POSTGRES_DB: mf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
            infra/resident/package-lock.json
            infra/org/package-lock.json
            infra/mail/package-lock.json
            infra/status/package-lock.json
            templates/web/package-lock.json

      # templates/web is the golden template the build-job harness seeds customer repos from; the
      # offline build-job e2e (packages/harness test/job/e2e.offline.test.ts) hard-links its
      # node_modules and runs the seeded repo's real lint/test, so it must be installed here too.
      - name: Install
        run: |
          npm ci
          npm ci --prefix templates/web
          npm ci --prefix infra
          npm ci --prefix infra/resident
          npm ci --prefix infra/org
          npm ci --prefix infra/mail
          npm ci --prefix infra/status

      - name: Lint
        run: npm run lint

      # Dependency scanning (M9). Allowed to fail for now: advisories in transitive dependencies
      # would otherwise block every PR until upstream ships a fix — Dependabot opens the PRs,
      # this step just keeps the count visible in the log. Drop `continue-on-error` once the
      # baseline is clean.
      - name: Audit dependencies (high+)
        continue-on-error: true
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix infra
          npm audit --audit-level=high --prefix infra/resident
          npm audit --audit-level=high --prefix infra/org
          npm audit --audit-level=high --prefix infra/mail
          npm audit --audit-level=high --prefix infra/status

      # Container image scanning (M9 follow-up): npm audit above only covers JS dependency
      # advisories in package.json — it says nothing about OS-package CVEs baked into the actual
      # api/job container images, which matters since apps/job runs untrusted customer workloads
      # and apps/api holds real secrets. The deploy pipeline's own image build (a CDK asset —
      # infra/lib/{web-stack,resources-stack}.ts, not a plain `docker build`) is deliberately NOT
      # duplicated here; these builds exist only to give Trivy something to scan and are never
      # pushed anywhere. Allowed to fail for now, same reasoning as npm audit above — OS
      # advisories shouldn't block every PR until triaged. Drop `continue-on-error` once the
      # baseline is clean.
      - name: Build images for scanning
        run: |
          docker build -f apps/api/Dockerfile -t mf-api:ci-scan .
          docker build -f apps/job/Dockerfile -t mf-job:ci-scan .

      - name: Scan api image (high+)
        # SHA-pinned, not tag-pinned: trivy-action's tags (0.0.1-0.34.2) were hijacked in a real
        # supply-chain attack (2026-03-19, GHSA-69fq-xp46-6x23) and force-pushed to credential-
        # stealing malware. v0.35.0 is the one tag confirmed untouched (GitHub immutable releases).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: mf-api:ci-scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      - name: Scan job image (high+)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: mf-job:ci-scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

      # Coverage thresholds (lines ≥ 60 %) are enforced by vitest.config.ts; the run fails below
      # the bar. Docker image builds (apps/job, apps/api) for deploy are deliberately NOT part of
      # CI — the deploy workflow builds those separately through CDK assets; the scan-only builds
      # above are unrelated and never reach a registry.
      - name: Test (with coverage)
        env:
          # Opts packages/db migrations.test.ts into the `postgres` service above; it resets this
          # database's public schema, so it is a throwaway, never a real dev/live URL.
          TEST_DATABASE_URL: postgres://mf:mf@localhost:5432/mf
        run: npm run coverage

      - name: Build SPAs
        run: npm run build

      # Renders each built SPA in headless Chrome (preinstalled on ubuntu-latest) and fails if
      # nothing mounts or the console shows an uncaught error — catches bundle-only breakage.
      - name: Smoke-test built SPAs
        run: npm run smoke

      - name: CDK synth
        working-directory: infra
        run: npx cdk synth --quiet

      # Template assertions: alarms/budget wiring and the security baseline (no plaintext
      # secrets in task definitions, least-privilege job role, headers, backups)
      - name: Infra tests
        working-directory: infra
        run: npm test

      # The customer-side CDK app (packages/resident's deploy template): its own lockfile, type
      # check, synth with the sample context and template assertions
      - name: Resident infra lint, synth, tests
        working-directory: infra/resident
        run: |
          npm run lint
          npx cdk synth --quiet --context repository=example/repo --context installationId=inst-ci
          npm test

      # The management-account org-governance CDK app (Customers OU + guardrail SCP): its own
      # lockfile, type check, offline synth (no AWS calls — root id is config), template assertions
      - name: Org infra lint, synth, tests
        working-directory: infra/org
        run: |
          npm run lint
          npx cdk synth --quiet
          npm test

      # Inbound-mail CDK app (MX + SES receive + forwarder Lambda), deployed once alongside
      # infra/org: its own lockfile, type check, offline synth (checked-in zone id/defaults —
      # no AWS calls), template assertions
      - name: Mail infra lint, synth, tests
        working-directory: infra/mail
        run: |
          npm run lint
          npx cdk synth --quiet
          npm test

      # Status-page CDK app (Uptime Kuma on Fargate + EFS behind status.mjukvaruhuset.se),
      # deployed once like infra/mail: its own lockfile, type check, offline synth (checked-in
      # PENDING placeholders for the not-yet-provisioned VPC/cert — no AWS calls), template assertions
      - name: Status infra lint, synth, tests
        working-directory: infra/status
        run: |
          npm run lint
          npx cdk synth --quiet
          npm test

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
