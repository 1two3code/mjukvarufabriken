name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, synth
    runs-on: ubuntu-latest
    # Throwaway Postgres so migrations run against a real server (packages/db migrations.test.ts).
    # Reached at localhost:5432; TEST_DATABASE_URL below opts the migration suite in.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mf
          POSTGRES_PASSWORD: mf
          POSTGRES_DB: mf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
            infra/resident/package-lock.json
            infra/org/package-lock.json
            infra/mail/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix infra
          npm ci --prefix infra/resident
          npm ci --prefix infra/org
          npm ci --prefix infra/mail

      - name: Lint
        run: npm run lint

      # Dependency scanning (M9). Allowed to fail for now: advisories in transitive dependencies
      # would otherwise block every PR until upstream ships a fix — Dependabot opens the PRs,
      # this step just keeps the count visible in the log. Drop `continue-on-error` once the
      # baseline is clean.
      - name: Audit dependencies (high+)
        continue-on-error: true
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix infra
          npm audit --audit-level=high --prefix infra/resident
          npm audit --audit-level=high --prefix infra/org
          npm audit --audit-level=high --prefix infra/mail

      # Coverage thresholds (lines ≥ 60 %) are enforced by vitest.config.ts; the run fails below
      # the bar. Docker image builds (apps/job, apps/api) are deliberately NOT part of CI — the
      # deploy workflow builds them once through CDK assets.
      - name: Test (with coverage)
        env:
          # Opts packages/db migrations.test.ts into the `postgres` service above; it resets this
          # database's public schema, so it is a throwaway, never a real dev/live URL.
          TEST_DATABASE_URL: postgres://mf:mf@localhost:5432/mf
        run: npm run coverage

      - name: Build SPAs
        run: npm run build

      # Renders each built SPA in headless Chrome (preinstalled on ubuntu-latest) and fails if
      # nothing mounts or the console shows an uncaught error — catches bundle-only breakage.
      - name: Smoke-test built SPAs
        run: npm run smoke

      - name: CDK synth
        working-directory: infra
        run: npx cdk synth --quiet

      # Template assertions: alarms/budget wiring and the security baseline (no plaintext
      # secrets in task definitions, least-privilege job role, headers, backups)
      - name: Infra tests
        working-directory: infra
        run: npm test

      # The customer-side CDK app (packages/resident's deploy template): its own lockfile, type
      # check, synth with the sample context and template assertions
      - name: Resident infra lint, synth, tests
        working-directory: infra/resident
        run: |
          npm run lint
          npx cdk synth --quiet --context repository=example/repo --context installationId=inst-ci
          npm test

      # The management-account org-governance CDK app (Customers OU + guardrail SCP): its own
      # lockfile, type check, offline synth (no AWS calls — root id is config), template assertions
      - name: Org infra lint, synth, tests
        working-directory: infra/org
        run: |
          npm run lint
          npx cdk synth --quiet
          npm test

      # Inbound-mail CDK app (MX + SES receive + forwarder Lambda), deployed once alongside
      # infra/org: its own lockfile, type check, offline synth (checked-in zone id/defaults —
      # no AWS calls), template assertions
      - name: Mail infra lint, synth, tests
        working-directory: infra/mail
        run: |
          npm run lint
          npx cdk synth --quiet
          npm test

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
