name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix infra

      - name: Lint
        run: npm run lint

      # Dependency scanning (M9). Allowed to fail for now: advisories in transitive dependencies
      # would otherwise block every PR until upstream ships a fix — Dependabot opens the PRs,
      # this step just keeps the count visible in the log. Drop `continue-on-error` once the
      # baseline is clean.
      - name: Audit dependencies (high+)
        continue-on-error: true
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix infra

      - name: Test (with coverage)
        run: npm run coverage

      - name: Build SPAs
        run: npm run build

      # Renders each built SPA in headless Chrome (preinstalled on ubuntu-latest) and fails if
      # nothing mounts or the console shows an uncaught error — catches bundle-only breakage.
      - name: Smoke-test built SPAs
        run: npm run smoke

      - name: CDK synth
        working-directory: infra
        run: npx cdk synth --quiet

      # Template assertions: alarms/budget wiring and the security baseline (no plaintext
      # secrets in task definitions, least-privilege job role, headers, backups)
      - name: Infra tests
        working-directory: infra
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
