# Build-job egress proxy. Every outbound HTTP(S) request from the job container goes through
# here (HTTP_PROXY/HTTPS_PROXY + NODE_USE_ENV_PROXY=1); anything not in `filter` is refused.
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Info
MaxClients 64

# Only CONNECT to 443 (TLS); plain-HTTP is still filtered by domain below
ConnectPort 443

# Domain allowlist — FilterDefaultDeny turns the filter file into an allowlist
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterType fnmatch
FilterCaseSensitive No

# Fargate sidecars share the task network namespace (localhost); compose uses a private network
Allow 127.0.0.1
Allow ::1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

ViaProxyName "mf-egress"
DisableViaHeader Yes
